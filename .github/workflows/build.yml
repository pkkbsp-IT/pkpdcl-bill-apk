from kivy.app import App
from kivy.uix.boxlayout import BoxLayout
from kivy.uix.label import Label
from kivy.uix.textinput import TextInput
from kivy.uix.button import Button


class BillCalculatorLayout(BoxLayout):
    def __init__(self, **kwargs):
        super().__init__(
            orientation="vertical",
            padding=24,
            spacing=14,
            **kwargs
        )

        self.add_widget(
            Label(
                text="PKPDCL बिल कैलकुलेटर",
                font_size="24sp",
                size_hint_y=None,
                height=60,
            )
        )

        self.units_input = TextInput(
            hint_text="यूनिट दर्ज करें (जैसे 120)",
            input_filter="float",
            multiline=False,
            font_size="18sp",
            size_hint_y=None,
            height=60,
        )
        self.add_widget(self.units_input)

        self.rate_input = TextInput(
            hint_text="प्रति यूनिट दर दर्ज करें (जैसे 6.5)",
            input_filter="float",
            multiline=False,
            font_size="18sp",
            size_hint_y=None,
            height=60,
        )
        self.add_widget(self.rate_input)

        calc_btn = Button(
            text="बिल कैलकुलेट करें",
            font_size="18sp",
            size_hint_y=None,
            height=65,
        )
        calc_btn.bind(on_release=self.calculate_bill)
        self.add_widget(calc_btn)

        self.result_label = Label(
            text="कुल बिल: ₹0.00",
            font_size="22sp",
            size_hint_y=None,
            height=70,
        )
        self.add_widget(self.result_label)

    def calculate_bill(self, instance):
        units_text = self.units_input.text.strip()
        rate_text = self.rate_input.text.strip()

        if not units_text or not rate_text:
            self.result_label.text = "कृपया यूनिट और दर दोनों भरें"
            return

        try:
            units = float(units_text)
            rate = float(rate_text)

            if units < 0 or rate < 0:
                self.result_label.text = "नेगेटिव संख्या अनुमति नहीं है"
                return

            total = units * rate
            self.result_label.text = f"कुल बिल: ₹{total:,.2f}"

        except ValueError:
            self.result_label.text = "कृपया सही संख्या दर्ज करें"


class PKPDCLBillApp(App):
    def build(self):
        self.title = "PKPDCL बिल ऐप"
        return BillCalculatorLayout()


if __name__ == "__main__":
    PKPDCLBillApp().run()
