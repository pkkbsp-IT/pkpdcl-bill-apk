name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      BUILDOZER_WARN_ON_ROOT: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sanitize buildozer.spec
        run: |
          if [ -f buildozer.spec ]; then
            sed -i 's/reportlab//g' buildozer.spec
            sed -i 's/openpyxl//g' buildozer.spec
            sed -i 's/et_xmlfile//g' buildozer.spec
            sed -i 's/qrcode//g' buildozer.spec
            sed -i 's/,,*/,/g' buildozer.spec
            sed -i 's/requirements = ,/requirements = /g' buildozer.spec
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer==1.6.0 cython==0.29.36 virtualenv

      - name: Cache Buildozer and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log

      - name: Show last error context on failure
        if: failure()
        run: |
          echo "===== LAST 40 LINES BEFORE END ====="
          grep -B 35 -m 1 "Buildozer failed to execute the last command" build.log || tail -n 40 build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          if-no-files-found: error
