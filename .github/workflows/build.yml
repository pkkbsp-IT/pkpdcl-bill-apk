
name: Build PKPDCL APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      BUILDOZER_WARN_ON_ROOT: "0"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            autoconf automake libtool \
            pkg-config \
            zlib1g-dev libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libltdl-dev \
            libtool-bin \
            gettext \
            wget

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install Cython==0.29.36
          python -m pip install buildozer==1.6.0

      - name: Check Project Files
        run: |
          test -f main.py
          test -f buildozer.spec
          test -f pkpdcl_logo.png
          echo "All required project files found."

      - name: Show Build Configuration
        run: |
          echo "Python version:"
          python --version
          echo "Buildozer version:"
          buildozer --version
          echo "Build configuration:"
          cat buildozer.spec

      - name: Build Debug APK
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PKPDCL-Spot-Billing-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PKPDCL-Build-Logs
          path: |
            .buildozer/android/platform/build-*/dists/*/build.log
            .buildozer/android/platform/build-*/dists/*/gradle.log
          if-no-files-found: ignore
          retention-days: 7
