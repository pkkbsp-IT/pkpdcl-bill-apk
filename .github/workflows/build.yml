name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      BUILDOZER_WARN_ON_ROOT: "0"
      ANDROID_HOME: "/usr/local/lib/android/sdk"
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system packages
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update --fix-missing && \
            sudo apt-get install -y --fix-missing \
              git zip unzip curl wget openjdk-17-jdk python3-pip autoconf libtool pkg-config \
              zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
              libssl-dev build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev \
              libreadline-dev libgdbm-dev liblzma-dev tk-dev uuid-dev && break || sleep 10
          done

      - name: Prepare Android SDK in Buildozer folder
        run: |
          SDK_DIR="/usr/local/lib/android/sdk"
          mkdir -p ~/.buildozer/android/platform
          ln -sfn "$SDK_DIR" ~/.buildozer/android/platform/android-sdk

          CMD_SDK=$(find "$SDK_DIR" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -n "$CMD_SDK" ]; then
            mkdir -p "$SDK_DIR/tools/bin"
            ln -sf "$CMD_SDK" "$SDK_DIR/tools/bin/sdkmanager"
            yes | "$CMD_SDK" --sdk_root="$SDK_DIR" --licenses || true
            yes | "$SDK_SDK" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
          fi

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0 cython==0.29.36 virtualenv setuptools

      - name: Configure global urllib User-Agent via sitecustomize
        run: |
          python - <<'EOF'
          import site, os

          ua = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          code = f"""import urllib.request as _ur

_UA = {ua!r}
_orig_urlopen = _ur.urlopen
_orig_urlretrieve = _ur.urlretrieve

def _wrap_req(url):
    if isinstance(url, str):
        return _ur.Request(url, headers={{"User-Agent": _UA}})
    if hasattr(url, "add_header") and not url.has_header("User-agent"):
        url.add_header("User-Agent", _UA)
    return url

def _ua_urlopen(url, *args, **kwargs):
    return _orig_urlopen(_wrap_req(url), *args, **kwargs)

def _ua_urlretrieve(url, filename=None, reporthook=None, data=None):
    opener = _ur.build_opener()
    opener.addheaders = [("User-Agent", _UA)]
    resp = opener.open(_wrap_req(url), data=data)
    if filename is None:
        import tempfile
        tf = tempfile.NamedTemporaryFile(delete=False)
        filename = tf.name
        tf.close()
    with open(filename, "wb") as out:
        while True:
            chunk = resp.read(65536)
            if not chunk:
                break
            out.write(chunk)
    return filename, resp.headers

_ur.urlopen = _ua_urlopen
_ur.urlretrieve = _ua_urlretrieve
"""

          targets = set(site.getsitepackages())
          user_site = site.getusersitepackages()
          if user_site:
              targets.add(user_site)

          for d in targets:
              os.makedirs(d, exist_ok=True)
              p = os.path.join(d, "sitecustomize.py")
              with open(p, "w", encoding="utf-8") as f:
                  f.write(code)
              print("Wrote:", p)
          EOF

      - name: Build debug APK
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log || {
            echo "=== 403 / DOWNLOAD URL LINES ==="
            grep -iE "403|Downloading |https?://" build.log | tail -n 30 || true
            echo "=== LAST 60 LINES BEFORE ENV ==="
            grep -n "ENVIRONMENT:" build.log | head -n 1 | cut -d: -f1 | xargs -I{} awk 'NR>={}-60 && NR<={}' build.log || tail -n 60 build.log
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          if-no-files-found: error
