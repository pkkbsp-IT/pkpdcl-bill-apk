name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      BUILDOZER_WARN_ON_ROOT: "0"
      ANDROID_HOME: "/usr/local/lib/android/sdk"
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system packages
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update --fix-missing && \
            sudo apt-get install -y --fix-missing \
              git zip unzip curl wget openjdk-17-jdk python3-pip autoconf libtool pkg-config \
              zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
              libssl-dev build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev \
              libreadline-dev libgdbm-dev liblzma-dev tk-dev uuid-dev && break || sleep 10
          done

      - name: Prepare Android SDK in Buildozer folder
        run: |
          SDK_DIR="/usr/local/lib/android/sdk"
          mkdir -p ~/.buildozer/android/platform
          ln -sfn "$SDK_DIR" ~/.buildozer/android/platform/android-sdk

          CMD_SDK=$(find "$SDK_DIR" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -n "$CMD_SDK" ]; then
            mkdir -p "$SDK_DIR/tools/bin"
            ln -sf "$CMD_SDK" "$SDK_DIR/tools/bin/sdkmanager"
            yes | "$CMD_SDK" --sdk_root="$SDK_DIR" --licenses || true
            yes | "$CMD_SDK" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
          fi

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0 cython==0.29.36 virtualenv setuptools
                - name: Patch p4a downloader User-Agent for 403
        run: |
          python - <<'EOF'
          import glob, os

          for path in glob.glob(os.path.expanduser("~/.buildozer/android/platform/python-for-android/pythonforandroid/toolchain.py")) + glob.glob("**/pythonforandroid/toolchain.py", recursive=True):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  src = f.read()
              if "Mozilla/5.0" not in src and "urlopen" in src:
                  hook = (
                      "import urllib.request as _ur\n"
                      "_orig_urlopen = _ur.urlopen\n"
                      "def _ua_urlopen(url, *args, **kwargs):\n"
                      "    if isinstance(url, str):\n"
                      "        url = _ur.Request(url, headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'})\n"
                      "    elif hasattr(url, 'add_header') and not url.has_header('User-agent'):\n"
                      "        url.add_header('User-Agent', 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36')\n"
                      "    return _orig_urlopen(url, *args, **kwargs)\n"
                      "_ur.urlopen = _ua_urlopen\n"
                  )
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(hook + src)
                  print("Patched:", path)
          EOF
      - name: Build debug APK
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log || {
            echo "=== 403 / DOWNLOAD URL LINES ==="
            grep -iE "403|Downloading |https?://" build.log | tail -n 30 || true
            echo "=== LAST 60 LINES BEFORE ENV ==="
            grep -n "ENVIRONMENT:" build.log | head -n 1 | cut -d: -f1 | xargs -I{} awk 'NR>={}-60 && NR<={}' build.log || tail -n 60 build.log
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          if-no-files-found: error
