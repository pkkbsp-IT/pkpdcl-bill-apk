name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: "noninteractive"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      BUILDOZER_WARN_ON_ROOT: "0"
      ANDROID_HOME: "/usr/local/lib/android/sdk"
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove reportlab from buildozer.spec
        run: |
          if [ -f buildozer.spec ]; then
            python3 - <<'PYEOF'
with open("buildozer.spec", "r", encoding="utf-8", errors="ignore") as f:
    lines = f.readlines()

out = []
for line in lines:
    if line.lstrip().startswith("requirements"):
        prefix, sep, val = line.partition("=")
        if sep:
            items = [
                x.strip()
                for x in val.split(",")
                if x.strip() and x.strip().lower() != "reportlab"
            ]
            line = prefix + "= " + ",".join(items) + "\n"
    out.append(line)

with open("buildozer.spec", "w", encoding="utf-8") as f:
    f.writelines(out)
PYEOF
            grep -E "^requirements" buildozer.spec || true
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system packages
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends \
            git zip unzip curl openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev \
            libreadline-dev libgdbm-dev liblzma-dev tk-dev uuid-dev

      - name: Prepare Android SDK
        run: |
          SDK_DIR="/usr/local/lib/android/sdk"
          mkdir -p ~/.buildozer/android/platform
          ln -sfn "$SDK_DIR" ~/.buildozer/android/platform/android-sdk
          CMD_SDK=$(find "$SDK_DIR" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -n "$CMD_SDK" ]; then
            mkdir -p "$SDK_DIR/tools/bin"
            ln -sf "$CMD_SDK" "$SDK_DIR/tools/bin/sdkmanager"
            yes | "$CMD_SDK" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            yes | "$CMD_SDK" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "build-tools;33.0.2" >/dev/null 2>&1 || true
          fi

      - name: Install Buildozer and Cython
        run: |
          python -m pip install -q --upgrade pip
          pip install -q buildozer==1.6.0 cython==0.29.36 virtualenv setuptools

      - name: Cache Buildozer and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee build.log || {
            echo "=== LAST ERRORS ==="
            grep -iE "403|Error:|Command failed|Exception|urllib\.error" build.log | tail -n 30 || true
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          if-no-files-found: error
