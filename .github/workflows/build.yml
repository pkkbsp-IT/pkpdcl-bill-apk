name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      BUILDOZER_WARN_ON_ROOT: "0"
      ANDROID_HOME: "/usr/local/lib/android/sdk"
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system packages
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update --fix-missing && \
            sudo apt-get install -y --fix-missing \
              git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
              zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
              libssl-dev build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev \
              libreadline-dev libgdbm-dev liblzma-dev tk-dev uuid-dev && break || sleep 10
          done

      - name: Prepare Android SDK in Buildozer folder
        run: |
          mkdir -p ~/.buildozer/android/platform
          if [ -d "/usr/local/lib/android/sdk" ] && [ ! -e ~/.buildozer/android/platform/android-sdk ]; then
            ln -s /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          fi
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk \
            "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0 cython==0.29.36 virtualenv setuptools

      - name: Build debug APK
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log || {
            echo "=== LAST 100 LINES OF BUILD LOG ==="
            tail -n 100 build.log
            echo "=== ERROR / FAILED / EXCEPTION LINES ==="
            grep -iE "error:|failed|exception|no module|not found|command failed" build.log | tail -n 40 || true
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          if-no-files-found: error
