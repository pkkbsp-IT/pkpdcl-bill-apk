
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build PKPDCL APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      BUILDOZER_WARN_ON_ROOT: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.6.0 cython==0.29.36 virtualenv

      - name: Cache Buildozer and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: pkpdcl-build-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            pkpdcl-build-${{ runner.os }}-

      - name: Check project files
        run: |
          test -f main.py
          test -f buildozer.spec
          echo "Project files found."
          echo "Python version:"
          python --version
          echo "Java version:"
          java -version

      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "========== BUILD ERRORS =========="
          if [ -f build.log ]; then
            grep -niE -B 8 -A 15 \
              'error:|fatal error:|FAILED|Exception|Traceback|not found|could not|failed' \
              build.log | tail -n 180 || true
            echo "========== LAST 100 LINES =========="
            tail -n 100 build.log
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkpdcl-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PKPDCL-Spot-Billing-APK
          path: bin/*.apk
          if-no-files-found: error
