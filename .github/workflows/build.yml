
name: Build PKPDCL APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: pkpdcl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      BUILDOZER_WARN_ON_ROOT: "0"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake \
            libffi-dev libssl-dev \
            libltdl-dev gettext

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheel setuptools
          python -m pip install "Cython==0.29.36"
          python -m pip install "buildozer==1.6.0"
          python -m pip install legacy-cgi

      - name: Verify Python CGI
        run: |
          python -c "import cgi; print('CGI module OK')"

      - name: Verify Project
        run: |
          test -f main.py
          test -f buildozer.spec
          test -f pkpdcl_logo.png
          echo "Project files OK"

      - name: Cache Android SDK and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: pkpdcl-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            pkpdcl-v2-${{ runner.os }}-

      - name: Clean Previous Build
        run: |
          rm -rf .buildozer/android/platform/build-arm64-v8a
          rm -rf bin

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Verify APK
        if: success()
        run: |
          find bin -maxdepth 1 -name "*.apk" -print
          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PKPDCL-Spot-Billing-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Failure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PKPDCL-Build-Error-Log
          path: build.log
          if-no-files-found: warn
