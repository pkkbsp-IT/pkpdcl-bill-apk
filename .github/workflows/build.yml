name: Build PKPDCL APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      BUILDOZER_WARN_ON_ROOT: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sanitize buildozer.spec
        run: |
          python3 - << 'EOF'
          import re
          from pathlib import Path

          spec_path = Path("buildozer.spec")
          if spec_path.exists():
              text = spec_path.read_text(encoding="utf-8")
              blocked = {"reportlab", "openpyxl", "qrcode", "et_xmlfile"}

              def clean_req(match):
                  prefix = match.group(1)
                  body = match.group(2)
                  items = [x.strip() for x in re.split(r"[,\n]", body) if x.strip()]
                  filtered = [
                      x for x in items
                      if x.split("==")[0].split(">=")[0].split("<=")[0].strip().lower() not in blocked
                  ]
                  if not filtered:
                      filtered = ["python3", "kivy", "pillow", "pyjnius"]
                  return prefix + ", ".join(filtered)

              text = re.sub(r"(requirements\s*=\s*)([^\n]+(?:\n[ \t]+[^\n]+)*)", clean_req, text)
              spec_path.write_text(text, encoding="utf-8")
              print("Sanitized buildozer.spec requirements:")
              for line in text.splitlines():
                  if line.strip().startswith("requirements"):
                      print(" ", line)
          else:
              print("buildozer.spec not found")
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip curl ca-certificates openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer==1.6.0 cython==0.29.36 virtualenv

      - name: Cache Buildozer and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "===== LAST ERROR LINES ====="
          grep -inE "error:|httperror|403|traceback|exception|no such file|failed" build.log | tail -n 35 || true
          echo "===== LAST 30 LINES OF BUILD LOG ====="
          tail -n 30 build.log || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          if-no-files-found: error
