name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      BUILDOZER_WARN_ON_ROOT: "0"
      ANDROID_HOME: "/usr/local/lib/android/sdk"
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system packages
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update --fix-missing && \
            sudo apt-get install -y --fix-missing \
              git zip unzip curl wget openjdk-17-jdk python3-pip autoconf libtool pkg-config \
              zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
              libssl-dev build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev \
              libreadline-dev libgdbm-dev liblzma-dev tk-dev uuid-dev && break || sleep 10
          done

      - name: Prepare Android SDK in Buildozer folder
        run: |
          SDK_DIR="/usr/local/lib/android/sdk"
          mkdir -p ~/.buildozer/android/platform
          ln -sfn "$SDK_DIR" ~/.buildozer/android/platform/android-sdk

          CMD_SDK=$(find "$SDK_DIR" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -n "$CMD_SDK" ]; then
            mkdir -p "$SDK_DIR/tools/bin"
            ln -sf "$CMD_SDK" "$SDK_DIR/tools/bin/sdkmanager"
            yes | "$CMD_SDK" --sdk_root="$SDK_DIR" --licenses || true
            yes | "$CMD_SDK" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
          fi

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0 cython==0.29.36 virtualenv setuptools

      - name: Build debug APK
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log || {
            FAILED_URL=$(grep -oE "https?://[^'\" )>]+" build.log | tail -n 1 || true)
            if [ -n "$FAILED_URL" ]; then
              echo "=== RETRYING FAILED DOWNLOAD WITH CURL: $FAILED_URL ==="
              FNAME=$(basename "$FAILED_URL")
              mkdir -p ~/.buildozer/android/platform/packages
              curl -fsSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" "$FAILED_URL" -o "/tmp/$FNAME" || true
              if [ -s "/tmp/$FNAME" ]; then
                find ~/.buildozer/android/platform -type d -name "packages" -exec cp "/tmp/$FNAME" "{}/" \; 2>/dev/null || true
                yes | buildozer -v android debug 2>&1 | tee build_retry.log && exit 0
              fi
            fi
            echo "=== 403 / DOWNLOAD URL LINES ==="
            grep -iE "403|Downloading |http" build.log | tail -n 30 || true
            echo "=== LAST 80 LINES OF BUILD LOG ==="
            tail -n 80 build.log
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          if-no-files-found: error
