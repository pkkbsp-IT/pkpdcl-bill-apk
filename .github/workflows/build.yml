from kivy.app import App
from kivy.uix.boxlayout import BoxLayout
from kivy.uix.label import Label
from kivy.uix.textinput import TextInput
from kivy.uix.button import Button


class BillCalculatorLayout(BoxLayout):
    def __init__(self, **kwargs):
        super().__init__(orientation="vertical", padding=24, spacing=14, **kwargs)

        self.add_widget(
            Label(
                text="PKPDCL Bill Calculator",
                font_size="24sp",
                size_hint_y=None,
                height=60,
            )
        )

        self.units_input = TextInput(
            hint_text="Units enter karein (e.g. 120)",
            input_filter="float",
            multiline=False,
            font_size="18sp",
            size_hint_y=None,
            height=60,
        )
        self.add_widget(self.units_input)

        self.rate_input = TextInput(
            hint_text="Rate per unit (e.g. 6.5)",
            input_filter="float",
            multiline=False,
            font_size="18sp",
            size_hint_y=None,
            height=60,
        )
        self.add_widget(self.rate_input)

        calc_btn = Button(
            text="Calculate Bill",
            font_size="18sp",
            size_hint_y=None,
            height=65,
        )
        calc_btn.bind(on_press=self.calculate_bill)
        self.add_widget(calc_btn)

        self.result_label = Label(
            text="Total Bill: ₹0.00",
            font_size="22sp",
            size_hint_y=None,
            height=70,
        )
        self.add_widget(self.result_label)

    def calculate_bill(self, instance):
        try:
            units = float(self.units_input.text or 0)
            rate = float(self.rate_input.text or 0)
            total = units * rate
            self.result_label.text = f"Total Bill: ₹{total:.2f}"
        except ValueError:
            self.result_label.text = "Sahi number dalein"


class PKPDCLBillApp(App):
    def build(self):
        self.title = "PKPDCL Bill App"
        return BillCalculatorLayout()


if __name__ == "__main__":
    PKPDCLBillApp().run()
